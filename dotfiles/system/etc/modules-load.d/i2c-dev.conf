# Load i2c-dev at boot so OpenRGB can reach SMBus RGB devices (G.Skill DDR5 DIMMs,
# the GPU). Without it only USB/HID controllers are detected and the RAM and GPU are
# invisible. i2c-piix4 (the AMD SMBus driver) is autoloaded; only the userspace
# /dev/i2c-* interface needs requesting here.
i2c-dev
