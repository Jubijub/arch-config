# Deployed by chezmoi. Read by the AUR google-chrome wrapper (/usr/bin/google-chrome-stable).
# Under niri XDG_CURRENT_DESKTOP is "niri", so Chrome would not detect a keyring and
# fall back to its "basic" plaintext store. Point it at gnome-keyring via libsecret
# (wiki 06, "Secrets: GNOME keyring").
--password-store=gnome-libsecret
