# Deployed by chezmoi. Belt and braces for a dark desktop: the primary switch is
# the dconf color-scheme key served through xdg-desktop-portal-gtk (wiki 06,
# "Force GTK apps to dark mode"); this file catches GTK apps that ignore the
# portal and read settings.ini directly.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita-dark
gtk-cursor-theme-size=24
